fragment CallRoomNoNesting on CallRoom {
  id
  title
  authenticatedOnly
  hasAccessCode
  closed
  isOwner
}
query callRoom($id: ID!) {
  callRoom(id: $id) {
    ...CallRoomNoNesting
  }
}
mutation createCallRoom($data: CallRoomSettingsInput!) {
  createCallRoom(data: $data) {
    ...CallRoomNoNesting
  }
}
mutation updateCallRoom($id: ID!, $data: CallRoomSettingsInput!) {
  updateCallRoom(id: $id, data: $data) {
    ...CallRoomNoNesting
  }
}
mutation closeCallRoom($id: ID!) {
  closeCallRoom(id: $id) {
    ...CallRoomNoNesting
  }
}
mutation joinCallRoom($id: ID!, $data: JoinCallRoomInput!) {
  joinCallRoom(id: $id, data: $data) {
    ...CallRoomNoNesting
    admissionToken
    resumeToken
    iceServers {
      urls
      username
      credential
    }
  }
}
